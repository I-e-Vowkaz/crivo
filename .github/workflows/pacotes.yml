# Gera o .deb e o .rpm a cada push na main (inclui o merge de PR) e sob demanda.
# Compila no Ubuntu 22.04 (glibc 2.35), como o packaging/deb/Containerfile: o .deb
# roda no Ubuntu 22.04 ou mais novo e no Debian 12, e o .rpm no Fedora atual.
# Os pacotes ficam como artifact da execução, na aba Actions.
name: Pacotes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pacotes:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev libxdo-dev

      # Mesmas versões do packaging/deb/Containerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run tauri build -- --bundles deb,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: crivo-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
